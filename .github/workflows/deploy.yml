name: 🚀 Deploy Frontend to Orange Pi

on:
  push:
    branches:
      - master
      #- dev

concurrency:
  group: production
  cancel-in-progress: true

  
jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted  # Changed from ubuntu-latest
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy Frontend
        run: |
          set -e
          
          echo "🚀 Starting Frontend Deployment"
          
          # Build Docker image
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api-finances.hardman.app.br \
            -t my-finances-frontend:latest .
          
          # Stop old container
          docker stop my-finances-app || true
          docker rm my-finances-app || true
          
          # Run new container
          docker run -d \
            -p 3000:3000 \
            --name my-finances-app \
            --restart unless-stopped \
            my-finances-frontend:latest
          
          # Verify
          sleep 5
          
          if docker ps | grep -q my-finances-app; then
            echo "✅ Frontend deployed!"
            echo "🌐 App: https://hardman.app.br"
          else
            echo "❌ Failed!"
            exit 1
          fi
          
          docker image prune -f